name: Build release packages

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: Windows release version without the v prefix
        type: string
        default: "1.0.2"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test sources
        run: |
          go test ./...
          cargo test --manifest-path tui/Cargo.toml
          node --check internal/server/web/app.js
          node --check internal/server/web/portal.js
      - name: Build Linux archive
        run: |
          rustup target add x86_64-unknown-linux-musl
          make portable-linux
          tar -tzf dist/TapSend-v1.0.1-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: TapSend-v1.0.1-linux-x86_64
          path: dist/TapSend-v1.0.1-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows-package.yml
    with:
      version: ${{ inputs.windows_version }}

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.TAPSEND_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Android release signing key is missing'; exit 1; }
          mkdir -p android/.android-user
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/.android-user/release.keystore
      - name: Build signed Android APK
        working-directory: android
        env:
          TAPSEND_RELEASE_KEYSTORE: ${{ github.workspace }}/android/.android-user/release.keystore
          TAPSEND_RELEASE_STORE_PASSWORD: ${{ secrets.TAPSEND_RELEASE_STORE_PASSWORD }}
          TAPSEND_RELEASE_KEY_PASSWORD: ${{ secrets.TAPSEND_RELEASE_KEY_PASSWORD }}
          TAPSEND_RELEASE_KEY_ALIAS: tapsend
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify and name APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/TapSend-v1.0.1-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TapSend-v1.0.1-android
          path: dist/TapSend-v1.0.1-android.apk
          if-no-files-found: error
