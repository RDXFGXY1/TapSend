name: Publish TapSend Docs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tapsend-docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r site/requirements.txt
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/tapsend-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy
        id: pages
        uses: actions/deploy-pages@v4
