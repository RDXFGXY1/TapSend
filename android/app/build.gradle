plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tapsend.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tapsend.android'
        minSdk 33
        targetSdk 35
        versionCode 10000
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        localDebug {
            storeFile rootProject.file('.android-user/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (System.getenv('TAPSEND_RELEASE_KEYSTORE') && System.getenv('TAPSEND_RELEASE_STORE_PASSWORD') && System.getenv('TAPSEND_RELEASE_KEY_PASSWORD')) {
            releaseKey {
                storeFile file(System.getenv('TAPSEND_RELEASE_KEYSTORE'))
                storePassword System.getenv('TAPSEND_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('TAPSEND_RELEASE_KEY_ALIAS') ?: 'tapsend'
                keyPassword System.getenv('TAPSEND_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (rootProject.file('.android-user/debug.keystore').exists()) {
                signingConfig signingConfigs.localDebug
            }
        }
        release {
            if (signingConfigs.findByName('releaseKey') != null) {
                signingConfig signingConfigs.releaseKey
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.zxing:core:3.5.4'
}
