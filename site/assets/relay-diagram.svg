    <rect x="220" y="29" width="160" height="166" rx="4" fill="#212d20" stroke="#8eac80"/>
    <rect x="419" y="40" width="160" height="146" rx="4" fill="#191f19" stroke="#62735e"/>
    <path d="M186 109h28m-7-6 7 6-7 6m178-6h28m-7-6 7 6-7 6" stroke="#d4efc2" stroke-width="2"/>
    <path d="M79 68h44v28H79zm12 35h20m-10-7v7M477 68h44v28h-44zm12 35h20m-10-7v7" stroke="#d4efc2" stroke-width="2" stroke-linecap="round"/>
