    <text x="481" y="144" text-anchor="middle" font-size="17" font-weight="700" fill="#f3f5ef">Android</text>
    <text x="481" y="165" text-anchor="middle" font-size="14" fill="#b7c3b4">Tools · Connect a PC</text>
